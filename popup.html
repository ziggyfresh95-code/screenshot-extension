<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapshot Folders</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="20" height="20" />
        <span>Snapshot Folders</span>
      </div>
      <button id="openGallery" class="link-btn" type="button" hidden>Gallery →</button>
    </header>

    <!-- Shown while signed out (setup / sign-in / sign-up). -->
    <div id="authRoot" class="auth-root"></div>

    <!-- Shown once signed in. -->
    <main id="appMain" hidden>
      <section class="save-row">
        <label for="folderSelect">Save to folder</label>
        <div class="folder-controls">
          <select id="folderSelect"></select>
          <button id="newFolderBtn" class="ghost" type="button" title="Create folder">
            + New
          </button>
        </div>
        <div id="newFolderRow" class="new-folder-row" hidden>
          <input
            id="newFolderInput"
            type="text"
            placeholder="Folder name"
            maxlength="60"
          />
          <button id="createFolderBtn" class="ghost" type="button">Create</button>
          <button id="cancelFolderBtn" class="ghost subtle" type="button">
            Cancel
          </button>
        </div>
      </section>

      <button id="captureBtn" class="primary big" type="button">
        <span class="camera">📸</span> Capture full tab
      </button>

      <button id="areaBtn" class="ghost big" type="button">
        <span class="camera">✂️</span> Select area
      </button>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section class="preview" id="previewWrap" hidden>
        <img id="previewImg" alt="Last screenshot preview" />
      </section>

      <div class="actions" id="postActions" hidden>
        <button id="galleryBtn" class="ghost" type="button">Open gallery</button>
        <button id="downloadBtn" class="ghost" type="button">Download PNG</button>
      </div>
    </main>

    <footer class="app-footer">
      <span id="accountEmail" class="account-email"></span>
      <button id="signOutBtn" class="link-btn" type="button" hidden>Sign out</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
